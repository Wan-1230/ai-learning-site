<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f0e8">
<title>AI 技术学习站 · 三个项目的背后</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="打开导航菜单"></button>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">AI 技术<em>学习</em>站</div>
      <div class="brand-sub">个人学习手册 · 三个项目的背后</div>
    </div>
    <div class="search-wrap">
      <div class="search-inner">
        <span id="searchIcon"></span>
        <input id="globalSearch" type="search" placeholder="搜索课程 / 问答 / 术语" autocomplete="off" aria-label="全站搜索">
        <span class="search-kbd"><kbd>/</kbd></span>
      </div>
      <div class="search-results" id="searchResults" role="listbox"></div>
    </div>
    <nav id="nav" aria-label="课程导航"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-danger-ghost btn-sm" id="resetProgress">重置学习进度</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="assets/data-rag.js"></script>
<script src="assets/data-agent.js"></script>
<script src="assets/data-nlink.js"></script>
<script src="assets/data-general.js"></script>
<script src="assets/data-aipm.js"></script>
<script src="assets/data-interv.js"></script>
<script src="assets/data-docs.js"></script>
<script src="assets/data-guide.js"></script>
